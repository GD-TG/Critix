# Isolated, disposable regression environment: no application volumes or host ports.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: critix_test
      POSTGRES_USER: critix_test
      POSTGRES_PASSWORD: local-regression-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U critix_test -d critix_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://critix_test:local-regression-only@db:5432/critix_test
      TEST_DATABASE_URL: postgresql+psycopg://critix_test:local-regression-only@db:5432/critix_test
    depends_on:
      db:
        condition: service_healthy
